<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanbox — Central de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--or:#F5A623;--od:#D4881A;--bg:#F2F5F9;--wh:#fff;--bd:#E2E8F0;--tx:#1A1F2E;--mu:#7A8799;--dm:#E2E8F0;--gr:#16A34A;--re:#DC2626;--sh:0 1px 8px rgba(0,0,0,.07);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--od),var(--or),#FFC85A,var(--or));z-index:99;}

/* LOADING */
#ov{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.lb-w{width:260px;height:5px;background:var(--dm);border-radius:9px;overflow:hidden;}
.lb{height:100%;background:var(--or);width:0%;transition:width .3s;}
.lt{font-size:.7rem;font-weight:700;color:var(--mu);letter-spacing:.15em;text-transform:uppercase;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.pulse{animation:pulse 1.4s ease-in-out infinite;}

/* LAYOUT */
.page{height:100vh;padding:16px 18px 12px;display:flex;flex-direction:column;gap:9px;display:none;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;background:var(--wh);border:1px solid var(--bd);border-radius:12px;padding:8px 18px;box-shadow:var(--sh);}
.brand{display:flex;align-items:center;gap:10px;}
.bsep{width:1px;height:24px;background:var(--bd);}
.bsub{font-size:.58rem;font-weight:800;color:var(--mu);letter-spacing:.2em;text-transform:uppercase;}
.hcenter{text-align:center;}
.dlbl{font-size:.56rem;font-weight:800;color:var(--mu);letter-spacing:.18em;text-transform:uppercase;}
.dval{font-family:'Bebas Neue';font-size:.95rem;color:var(--od);}
.hright{display:flex;align-items:center;gap:12px;}
.live{display:flex;align-items:center;gap:5px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);padding:3px 10px;border-radius:999px;font-size:.58rem;font-weight:800;color:var(--od);letter-spacing:.12em;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--or);animation:sonar 2s ease-in-out infinite;}
@keyframes sonar{0%{box-shadow:0 0 0 0 rgba(245,166,35,.5);}70%{box-shadow:0 0 0 8px rgba(245,166,35,0);}100%{box-shadow:0 0 0 0 rgba(245,166,35,0);}}
.clock{font-family:'Bebas Neue';font-size:1.7rem;color:var(--od);}
.btn-att{background:none;border:1px solid var(--bd);border-radius:7px;padding:3px 9px;font:700 .58rem 'Nunito';color:var(--mu);cursor:pointer;}
.btn-att:hover{border-color:var(--or);color:var(--or);}

/* FILTRO */
.filtro{display:flex;align-items:center;gap:8px;background:var(--wh);border:1px solid var(--bd);border-radius:10px;padding:6px 14px;box-shadow:var(--sh);}
.flbl{font-size:.56rem;font-weight:800;color:var(--mu);letter-spacing:.15em;text-transform:uppercase;}
.fbtns{display:flex;gap:4px;}
.fbtn{background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 11px;font:800 .62rem 'Nunito';color:var(--mu);cursor:pointer;transition:all .15s;}
.fbtn:hover{border-color:var(--or);color:var(--or);}
.fbtn.on{background:var(--or);border-color:var(--or);color:#fff;}
.fcustom{display:none;align-items:center;gap:6px;}
.fcustom.show{display:flex;}
.fcustom input{border:1px solid var(--bd);border-radius:5px;padding:2px 6px;font:700 .62rem 'Nunito';color:var(--tx);width:105px;}
.faply{background:var(--or);border:none;border-radius:5px;padding:3px 9px;font:800 .62rem 'Nunito';color:#fff;cursor:pointer;}

/* KPIs */
.kr{display:grid;grid-template-columns:1.6fr 1.6fr 1fr 1fr 1fr;gap:8px;}
.kpi{background:var(--wh);border:1px solid var(--bd);border-radius:11px;padding:11px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--or));}
.kl{font-size:.56rem;font-weight:800;color:var(--mu);letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px;}
.kv{font-family:'Bebas Neue';font-size:2rem;line-height:1;color:var(--kc,var(--od));margin-bottom:3px;}
.ks{font-size:.6rem;font-weight:700;color:var(--mu);}
.pw{margin-top:6px;}
.pl{display:flex;justify-content:space-between;font-size:.56rem;font-weight:800;color:var(--mu);margin-bottom:3px;}
.cok{color:var(--gr)!important;}.cmid{color:var(--or)!important;}.clow{color:var(--re)!important;}
.pt{height:4px;background:var(--dm);border-radius:9px;overflow:hidden;}
.pf{height:100%;border-radius:9px;transition:width 1.4s cubic-bezier(.4,0,.2,1);}

/* CANAIS */
.cr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.cn{background:var(--wh);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--sh);}
.ct{display:flex;align-items:center;justify-content:space-between;}
.clogo{display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 7px;height:28px;min-width:68px;}
.cpct{font-family:'Bebas Neue';font-size:.9rem;}
.cv{font-family:'Bebas Neue';font-size:1.35rem;line-height:1;}
.cm{display:flex;justify-content:space-between;}
.cml{font-size:.52rem;font-weight:800;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;}
.cmv{font-size:.6rem;font-weight:700;color:var(--mu);}
.cf{display:flex;justify-content:space-between;align-items:center;}
.cpe{font-size:.54rem;font-weight:800;color:var(--mu);}
.dl{font-size:.52rem;font-weight:800;padding:2px 5px;border-radius:99px;}
.dok{background:rgba(22,163,74,.08);color:var(--gr);}.dmi{background:rgba(245,166,35,.1);color:var(--od);}.dlo{background:rgba(220,38,38,.08);color:var(--re);}

/* BOTTOM */
.br{display:grid;grid-template-columns:1.7fr 1fr;gap:8px;flex:1;min-height:0;}
.pn{background:var(--wh);border:1px solid var(--bd);border-radius:11px;padding:10px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;}
.pti{font-size:.56rem;font-weight:900;color:var(--mu);letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.pti::after{content:'';flex:1;height:1px;background:var(--dm);}
.pdot{width:5px;height:5px;border-radius:50%;background:var(--or);}
.prl{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden;}
.pi{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:4px 8px;}
.prk{font-family:'Bebas Neue';font-size:.95rem;color:var(--or);min-width:14px;text-align:center;}
.pif{flex:1;min-width:0;}
.pnm{font-size:.64rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.psb{font-size:.54rem;font-weight:700;color:var(--mu);}
.pbw{width:60px;}
.pbt{height:3px;background:var(--dm);border-radius:9px;overflow:hidden;}
.pbf{height:100%;border-radius:9px;background:var(--or);}
.pvl{font-family:'Bebas Neue';font-size:.84rem;color:var(--od);min-width:52px;text-align:right;}
.fl{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden;}
.fi{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:5px 10px;}
.fr{font-family:'Bebas Neue';font-size:1.1rem;color:var(--or);min-width:16px;}
.fif{flex:1;}
.fnm{font-size:.68rem;font-weight:800;}
.fsb{font-size:.55rem;font-weight:700;color:var(--mu);}
.fg{text-align:right;}
.fv{font-family:'Bebas Neue';font-size:1rem;color:var(--od);}
.fp{font-size:.55rem;font-weight:800;color:var(--mu);}
.fbr{margin:1px 0 2px;}

/* TICKER */
.tk{background:var(--wh);border:1px solid var(--bd);border-radius:7px;padding:4px 12px;overflow:hidden;white-space:nowrap;box-shadow:var(--sh);flex-shrink:0;}
.ti{display:inline-block;animation:tick 55s linear infinite;font-size:.62rem;font-weight:700;color:var(--mu);}
.ti .hi{color:var(--od);font-weight:900;}.ti .sp{color:var(--bd);margin:0 10px;}
@keyframes tick{from{transform:translateX(100vw);}to{transform:translateX(-100%);}}

/* MOBILE */
@media(max-width:768px){
  body{overflow:auto;}
  .page{height:auto;padding:10px;}
  .bsub,.bsep,.hcenter{display:none;}
  .kr{grid-template-columns:1fr 1fr;}
  .kr .kpi:first-child{grid-column:1/3;}
  .cr{grid-template-columns:1fr 1fr;}
  .br{grid-template-columns:1fr;}
  .tk{display:none;}
  .kv{font-size:1.6rem;}
  .clock{font-size:1.3rem;}
}
@media(max-width:420px){
  .cr{grid-template-columns:1fr;}
  .kr{grid-template-columns:1fr;}
  .kr .kpi:first-child{grid-column:1;}
}
</style>
</head>
<body>

<div id="ov">
  <svg class="pulse" height="50" viewBox="0 0 210 58" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#F5A623"/>
    <rect x="11" y="11" width="34" height="34" rx="7" fill="white"/>
    <rect x="19" y="20" width="13" height="7" rx="2" fill="#F5A623"/>
    <text x="66" y="43" font-family="Nunito" font-weight="900" font-size="36" fill="#1A1A1A">san</text>
    <text x="130" y="43" font-family="Nunito" font-weight="900" font-size="36" fill="#F5A623">box</text>
  </svg>
  <div class="lb-w"><div class="lb" id="lb"></div></div>
  <div class="lt" id="lt">Iniciando...</div>
</div>

<div class="page" id="dash">
  <header>
    <div class="brand">
      <svg height="32" viewBox="0 0 210 58" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="56" height="56" rx="12" fill="#F5A623"/>
        <rect x="11" y="11" width="34" height="34" rx="7" fill="white"/>
        <rect x="19" y="20" width="13" height="7" rx="2" fill="#F5A623"/>
        <text x="66" y="43" font-family="Nunito" font-weight="900" font-size="36" fill="#1A1A1A">san</text>
        <text x="130" y="43" font-family="Nunito" font-weight="900" font-size="36" fill="#F5A623">box</text>
      </svg>
      <div class="bsep"></div>
      <div class="bsub">Central de Vendas</div>
    </div>
    <div class="hcenter">
      <div class="dlbl">Referência</div>
      <div class="dval" id="dRef">--</div>
    </div>
    <div class="hright">
      <button class="btn-att" onclick="load()">⟳ Atualizar</button>
      <div class="live"><div class="dot"></div><span id="sLbl">AO VIVO</span></div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
  </header>

  <!-- FILTRO -->
  <div class="filtro">
    <div class="flbl">Período:</div>
    <div class="fbtns">
      <button class="fbtn on" id="fDia" onclick="filtrar('dia')">📅 Dia</button>
      <button class="fbtn" id="fMes" onclick="filtrar('mes')">📆 Mês</button>
      <button class="fbtn" id="fCus" onclick="filtrar('custom')">🗓 Personalizado</button>
    </div>
    <div class="fcustom" id="fCustom">
      <input type="date" id="fIni">
      <span style="font-size:.62rem;color:var(--mu)">até</span>
      <input type="date" id="fFim">
      <button class="faply" onclick="aplicar()">Aplicar</button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kr">
    <div class="kpi" style="--kc:var(--or)">
      <div class="kl">Faturamento do Período</div>
      <div class="kv" id="kFat">R$ --</div>
      <div class="ks" id="kFatSub">--</div>
      <div class="pw">
        <div class="pl"><span>Meta: <span id="kMeta">--</span></span><span id="kPct" class="clow">--%</span></div>
        <div class="pt"><div class="pf" id="fPct" style="width:0%;background:var(--or)"></div></div>
      </div>
    </div>
    <div class="kpi" style="--kc:var(--od)">
      <div class="kl">Vendas do Mês</div>
      <div class="kv" id="kMes">R$ --</div>
      <div class="ks" id="kMesSub">--</div>
      <div class="pw">
        <div class="pl"><span>Meta: <span id="kMetaMes">--</span></span><span id="kPctMes" class="clow">--%</span></div>
        <div class="pt"><div class="pf" id="fPctMes" style="width:0%;background:var(--od)"></div></div>
      </div>
    </div>
    <div class="kpi" style="--kc:var(--gr)">
      <div class="kl">Pedidos</div>
      <div class="kv" id="kPeds" style="font-size:2.4rem">--</div>
      <div class="ks">no período</div>
    </div>
    <div class="kpi" style="--kc:#F0A500">
      <div class="kl">Ticket Médio</div>
      <div class="kv" id="kTicket">R$ --</div>
      <div class="ks">por pedido</div>
    </div>
    <div class="kpi" style="--kc:#64748b">
      <div class="kl">Vendas Ontem</div>
      <div class="kv" id="kOnt" style="font-size:1.65rem">R$ --</div>
      <div class="ks" id="kOntSub">-- pedidos</div>
    </div>
  </div>

  <!-- CANAIS -->
  <div class="cr" id="canaisEl"></div>

  <!-- BOTTOM -->
  <div class="br">
    <div class="pn">
      <div class="pti"><div class="pdot"></div><span id="tProd">Top Produtos — Dia</span></div>
      <div class="prl" id="prodsEl"></div>
    </div>
    <div class="pn">
      <div class="pti"><div class="pdot"></div><span id="tForn">Top Fornecedores — Dia</span></div>
      <div class="fl" id="fornEl"></div>
    </div>
  </div>

  <div class="tk"><div class="ti" id="ticker">Carregando...</div></div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────
const KEY      = 'AIzaSyCpFaibN_ct8r2ywjIlKByvZkxok5ytqXI';
const KOND_ID  = '1d4ORz_TloSJPBq8LZMrbD7YoPZSUFONExKg1heEBFrU';
const METAS_ID = '1eloyFGbm53vZB1RJJZt99vXDKecgjKmZyal4n_UmwIk';

// Colunas tinyerp_pedidos_detalhes
const C = {ID:0, ENOME:26, ENUM:28, TOTAL:56, SIT:62, DATA:64};
// Colunas tinyerp_pedidos_detalhes_itens
const I = {ID:0, DESC:2, QTD:4, VUNIT:6, SIT:9, DATA:11};

const VALIDAS = new Set(['aprovado','preparando envio','faturado','pronto para envio','enviando','enviado','entregue']);
const CANAIS  = ['Mercado Livre','Casas Bahia','Magazine Luiza','Shopee','Amazon'];
const CORES   = {'Mercado Livre':'#C8A000','Casas Bahia':'#0052A5','Magazine Luiza':'#CC0066','Shopee':'#EE4D2D','Amazon':'#E47911'};

// ── ESTADO ─────────────────────────────────────────────────────
let _modo = 'dia'; // dia | mes | custom
let _ini  = null, _fim = null;
let _cache = null; // {pRows, iRows, metas}
let _diaRef = '', _ontRef = '';

// ── HELPERS ────────────────────────────────────────────────────
const R   = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const N   = s => parseFloat((s||'0').toString().replace(/\./g,'').replace(',','.')) || 0;
const pD  = s => { const p=(s||'').split('/'); return p.length<3?new Date(0):new Date(+p[2],+p[0]-1,+p[1]); };
const fmtD = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase();

function isMes(s) {
  const p=(s||'').split('/'), n=new Date();
  return p.length>=3 && +p[0]===n.getMonth()+1 && +p[2]===n.getFullYear();
}
function isRange(s) {
  if(!_ini||!_fim||!s) return false;
  const d=pD(s);
  return d>=pD(_ini) && d<=pD(_fim);
}
function isPeriodo(s) {
  if(_modo==='dia')    return s===_diaRef;
  if(_modo==='mes')    return isMes(s);
  if(_modo==='custom') return isRange(s);
  return false;
}

function getCanal(nome, num) {
  const n=(nome||'').toLowerCase();
  if(n.includes('mercado livre')) return 'Mercado Livre';
  if(n.includes('shopee'))        return 'Shopee';
  if(n.includes('amazon'))        return 'Amazon';
  if(n.includes('casas bahia')||n.includes('via varejo')) return 'Casas Bahia';
  if(n.includes('magazine')||n.includes('magalu'))        return 'Magazine Luiza';
  const u=num||'';
  if(u.startsWith('2000'))  return 'Mercado Livre';
  if(u.startsWith('260'))   return 'Shopee';
  if(/^\d{3}-\d+/.test(u)) return 'Amazon';
  if(u.startsWith('51'))    return 'Magazine Luiza';
  if(u.startsWith('LU-'))   return 'Casas Bahia';
  return 'Outros';
}

function getMarca(desc) {
  const d=(desc||'').toLowerCase();
  const lista=[
    ['Mueller','mueller'],['Mueller','muller'],
    ['Imbera','imbera'],['Itatiaia','itatiaia'],['Atlas','atlas coliseum'],
    ['Midea','midea'],['Philco','philco'],['Amvox','amvox'],['Dako','dako'],
    ['Pulse','pulse'],['SSOUND','ssound'],['Mallory','mallory'],
    ['Britania','britania'],['Mondial','mondial'],['Electrolux','electrolux'],
    ['Brastemp','brastemp'],['Consul','consul'],['LG',' lg '],
    ['Samsung','samsung'],['Multilaser','multilaser'],['Intelbras','intelbras'],
    ['Knup','knup'],['Best','best '],['Suggar','suggar'],['Cadence','cadence'],
    ['Arno','arno'],['Tramontina','tramontina'],['Fischer','fischer'],
  ];
  for(const [nome, key] of lista) if(d.includes(key)) return nome;
  return 'Outros';
}

function periodoLabel() {
  if(_modo==='dia') return _diaRef ? fmtD(pD(_diaRef)) : 'Dia';
  if(_modo==='mes') { const n=new Date(); return n.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase(); }
  if(_modo==='custom'&&_ini&&_fim) return `${_ini.split('/').reverse().join('/')} → ${_fim.split('/').reverse().join('/')}`;
  return '';
}

// ── SHEETS API ──────────────────────────────────────────────────
function setLoad(p,t) {
  document.getElementById('lb').style.width=p+'%';
  if(t) document.getElementById('lt').textContent=t;
}

async function fetchSheet(id, range, aba) {
  const enc = aba ? encodeURIComponent(aba+'!'+range) : range;
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${enc}?key=${KEY}`);
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.values||[];
}

// ── METAS ───────────────────────────────────────────────────────
async function getMetas() {
  setLoad(10,'Lendo metas...');
  try {
    const rows = await fetchSheet(METAS_ID,'A1:G45');
    let metaMes=0; const dias={};
    for(const r of rows) {
      const c0=(r[0]||'').trim();
      if(c0.match(/^[a-zA-ZÀ-ú]+\/\d{4}$/i)&&r[1]) metaMes=N(r[1]);
      if(c0.match(/^\d{2}\/\d{2}\/\d{4}$/)) {
        const p=c0.split('/');
        const key=`${+p[1]}/${+p[0]}/${p[2]}`;
        const ml=N(r[1]),cb=N(r[2]),mg=N(r[3]),sh=N(r[4]),amz=N(r[5]);
        dias[key]={'Mercado Livre':ml,'Casas Bahia':cb,'Magazine Luiza':mg,'Shopee':sh,'Amazon':amz,'total':N(r[6])||ml+cb+mg+sh+amz};
      }
    }
    return {metaMes, dias};
  } catch(e) { console.warn('[Metas]',e.message); return {metaMes:0, dias:{}}; }
}

// ── PROCESSAR ───────────────────────────────────────────────────
function processar(pRows, iRows, metas) {
  // Acha dia ref (último dia com dados válidos)
  const datas=new Set();
  for(let i=1;i<pRows.length;i++) {
    const sit=(pRows[i][C.SIT]||'').toLowerCase().trim();
    const dat=(pRows[i][C.DATA]||'').trim();
    if(VALIDAS.has(sit)&&dat) datas.add(dat);
  }
  const sorted=[...datas].sort((a,b)=>pD(b)-pD(a));
  _diaRef = sorted[0]||'';
  _ontRef = sorted[1]||'';

  // Acumuladores
  const cPer={}, cMes={};
  CANAIS.forEach(c=>{cPer[c]={f:0,p:0};cMes[c]={f:0,p:0};});
  let tPer=0,nPer=0, tMes=0,nMes=0, tOnt=0,nOnt=0;
  const idsPer=new Set(), idsMes=new Set(), idsOnt=new Set();

  for(let i=1;i<pRows.length;i++) {
    const r=pRows[i];
    const id=(r[C.ID]||'').trim();
    const sit=(r[C.SIT]||'').toLowerCase().trim();
    const dat=(r[C.DATA]||'').trim();
    if(!id||!VALIDAS.has(sit)) continue;
    const fat=parseFloat((r[C.TOTAL]||'0').replace(',','.'))||0;
    const cn=getCanal(r[C.ENOME],r[C.ENUM]);

    // Período selecionado
    if(isPeriodo(dat)&&!idsPer.has(id)) {
      idsPer.add(id); tPer+=fat; nPer++;
      if(cPer[cn]){cPer[cn].f+=fat;cPer[cn].p++;}
    }
    // Mês (sempre)
    if(isMes(dat)&&!idsMes.has(id)) {
      idsMes.add(id); tMes+=fat; nMes++;
      if(cMes[cn]){cMes[cn].f+=fat;cMes[cn].p++;}
    }
    // Ontem
    if(dat===_ontRef&&!idsOnt.has(id)) {
      idsOnt.add(id); tOnt+=fat; nOnt++;
    }
  }

  // Itens — top produtos e fornecedores do período
  const prodMap={}, fornMap={};
  for(let i=1;i<iRows.length;i++) {
    const r=iRows[i];
    const id=(r[I.ID]||'').trim();
    const sit=(r[I.SIT]||'').toLowerCase().trim();
    const dat=(r[I.DATA]||'').trim();
    if(!VALIDAS.has(sit)) continue;

    // Verifica se está no período (por data ou por id do pedido)
    const inPer = isPeriodo(dat) || idsPer.has(id);
    if(!inPer) continue;

    const desc=(r[I.DESC]||'').trim();
    const qtd=parseFloat((r[I.QTD]||'1').replace(',','.'))||1;
    const vu=parseFloat((r[I.VUNIT]||'0').replace(',','.'))||0;
    const fat=qtd*vu;
    const mk=getMarca(desc);
    const nm=desc.substring(0,58);

    if(!prodMap[nm])prodMap[nm]={q:0,f:0};
    prodMap[nm].q+=qtd; prodMap[nm].f+=fat;

    if(!fornMap[mk])fornMap[mk]={f:0,peds:new Set()};
    fornMap[mk].f+=fat; fornMap[mk].peds.add(id);
  }

  const topP=Object.entries(prodMap).sort((a,b)=>b[1].f-a[1].f).slice(0,8)
    .map(([n,d])=>({n,q:d.q,f:d.f}));
  const topF=Object.entries(fornMap).sort((a,b)=>b[1].f-a[1].f).slice(0,10)
    .map(([n,d])=>({n,f:d.f,p:d.peds.size,pct:tPer>0?(d.f/tPer*100).toFixed(1):0}));

  // Metas
  const metaDia = metas.dias[_diaRef]||{};
  const metaTot = _modo==='dia' ? (metaDia.total||CANAIS.reduce((s,c)=>s+(metaDia[c]||0),0)) :
                  _modo==='mes' ? metas.metaMes : 0;
  const pctPer = metaTot>0 ? Math.min(tPer/metaTot*100,999).toFixed(1) : 0;
  const pctMes = metas.metaMes>0 ? Math.min(tMes/metas.metaMes*100,999).toFixed(1) : 0;

  const canais=CANAIS.map(nm=>{
    const d=cPer[nm]||{f:0,p:0};
    const m=_modo==='dia'?(metaDia[nm]||0):0;
    const pct=m>0?Math.min(d.f/m*100,999).toFixed(1):0;
    return {nm,f:d.f,p:d.p,m,pct:+pct};
  });

  return {tPer,nPer,tMes,nMes,tOnt,nOnt,metaTot,metaMes:metas.metaMes,pctPer:+pctPer,pctMes:+pctMes,canais,topP,topF};
}

// ── RENDER ──────────────────────────────────────────────────────
function pCls(p){return p>=70?'cok':p>=35?'cmid':'clow';}
function dCls(p){return p>=70?'dok':p>=35?'dmi':'dlo';}
function dLbl(p){return p>=100?'✓ Meta!':p>=70?`→${(100-p).toFixed(0)}%`:` ↓${(100-p).toFixed(0)}%`;}

const LOGOS = {
  'Mercado Livre':`<svg height="18" viewBox="0 0 110 20"><ellipse cx="9" cy="10" rx="9" ry="9" fill="#FFE600"/><path d="M4 8l5 4 5-4" fill="none" stroke="#333399" stroke-width="1.8" stroke-linecap="round"/><text x="22" y="8" font-family="Arial" font-weight="700" font-size="7.5" fill="#333399">Mercado</text><text x="22" y="17" font-family="Arial" font-weight="700" font-size="7.5" fill="#333399">Livre</text></svg>`,
  'Casas Bahia':`<svg height="18" viewBox="0 0 110 20"><rect x="0" y="1" width="18" height="18" rx="4" fill="#0052A5"/><text x="2" y="14" font-family="Arial" font-weight="900" font-size="10" fill="white">CB</text><text x="22" y="8" font-family="Arial" font-weight="700" font-size="7.5" fill="#0052A5">Casas</text><text x="22" y="17" font-family="Arial" font-weight="700" font-size="7.5" fill="#0052A5">Bahia</text></svg>`,
  'Magazine Luiza':`<svg height="18" viewBox="0 0 110 20"><rect x="0" y="1" width="18" height="18" rx="4" fill="#CC0066"/><text x="1" y="14" font-family="Arial" font-weight="900" font-size="10" fill="white">ML</text><text x="22" y="8" font-family="Arial" font-weight="700" font-size="7.5" fill="#CC0066">Magazine</text><text x="22" y="17" font-family="Arial" font-weight="700" font-size="7.5" fill="#CC0066">Luiza</text></svg>`,
  'Shopee':`<svg height="18" viewBox="0 0 110 20"><circle cx="9" cy="10" r="9" fill="#EE4D2D"/><text x="4" y="14" font-family="Arial" font-weight="900" font-size="12" fill="white">S</text><text x="22" y="13" font-family="Arial" font-weight="800" font-size="11" fill="#EE4D2D">Shopee</text></svg>`,
  'Amazon':`<svg height="18" viewBox="0 0 110 20"><text x="0" y="13" font-family="Arial" font-weight="900" font-size="13" fill="#1A1A1A">amazon</text><path d="M1 17 Q26 23 52 17" stroke="#FF9900" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="50,15 54,18 50,21" fill="#FF9900"/></svg>`,
};

function render(d) {
  const lbl = periodoLabel();

  // Header data ref
  document.getElementById('dRef').textContent = _diaRef ? fmtD(pD(_diaRef)) : '--';

  // KPIs
  document.getElementById('kFat').textContent    = R(d.tPer);
  document.getElementById('kFatSub').textContent = `${d.nPer} pedidos — ${lbl}`;
  document.getElementById('kMeta').textContent   = R(d.metaTot);
  const pk=document.getElementById('kPct'); pk.textContent=`${d.pctPer}%`; pk.className=pCls(d.pctPer);

  document.getElementById('kMes').textContent    = R(d.tMes);
  document.getElementById('kMesSub').textContent = new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase();
  document.getElementById('kMetaMes').textContent= R(d.metaMes);
  const pm=document.getElementById('kPctMes'); pm.textContent=`${d.pctMes}%`; pm.className=pCls(d.pctMes);

  document.getElementById('kPeds').textContent  = d.nPer;
  document.getElementById('kTicket').textContent= R(d.nPer>0?d.tPer/d.nPer:0);
  document.getElementById('kOnt').textContent   = R(d.tOnt);
  document.getElementById('kOntSub').textContent= `${d.nOnt} pedidos ontem`;

  setTimeout(()=>{
    document.getElementById('fPct').style.width   = Math.min(d.pctPer,100)+'%';
    document.getElementById('fPctMes').style.width= Math.min(d.pctMes,100)+'%';
  },200);

  // Canais
  document.getElementById('canaisEl').innerHTML=d.canais.map(c=>{
    const cor=CORES[c.nm]||'#999';
    return `<div class="cn">
      <div class="ct"><div class="clogo">${LOGOS[c.nm]||c.nm}</div><span class="cpct" style="color:${cor}">${c.pct}%</span></div>
      <div class="cv" style="color:${cor}">${R(c.f)}</div>
      <div class="cm"><span class="cml">Meta Dia</span><span class="cmv">${R(c.m)}</span></div>
      <div class="pt"><div class="pf" style="width:${Math.min(c.pct,100)}%;background:${cor}"></div></div>
      <div class="cf"><span class="cpe">${c.p} pedidos</span><span class="dl ${dCls(c.pct)}">${dLbl(c.pct)}</span></div>
    </div>`;
  }).join('');

  // Títulos dinâmicos
  document.getElementById('tProd').textContent = `Top Produtos — ${lbl}`;
  document.getElementById('tForn').textContent = `Top Fornecedores — ${lbl}`;

  // Top Produtos
  const mP=d.topP[0]?.f||1;
  document.getElementById('prodsEl').innerHTML = d.topP.length
    ? d.topP.map((p,i)=>`<div class="pi">
        <div class="prk">${i+1}</div>
        <div class="pif"><div class="pnm">${p.n}</div><div class="psb">${p.q} un</div></div>
        <div class="pbw"><div class="pbt"><div class="pbf" style="width:${(p.f/mP*100).toFixed(0)}%"></div></div></div>
        <div class="pvl">${R(p.f)}</div>
      </div>`).join('')
    : '<div style="color:var(--mu);font-size:.72rem;padding:8px">Sem dados no período</div>';

  // Top Fornecedores
  const mF=d.topF[0]?.f||1;
  document.getElementById('fornEl').innerHTML = d.topF.length
    ? d.topF.map((f,i)=>`
      <div class="fi">
        <div class="fr">${i+1}</div>
        <div class="fif"><div class="fnm">${f.n}</div><div class="fsb">${f.p} pedidos</div></div>
        <div class="fg"><div class="fv">${R(f.f)}</div><div class="fp">${f.pct}%</div></div>
      </div>
      <div class="fbr pt"><div class="pf" style="width:${(f.f/mF*100).toFixed(0)}%;background:var(--or)"></div></div>
    `).join('')
    : '<div style="color:var(--mu);font-size:.72rem;padding:8px">Sem dados no período</div>';

  // Ticker
  const tC=[...d.canais].sort((a,b)=>b.f-a.f)[0];
  const tP=d.topP[0];
  const tF=d.topF[0];
  document.getElementById('ticker').innerHTML=`
    <span class="hi">🏆 MELHOR CANAL:</span> ${tC?.nm} — ${R(tC?.f)} (${tC?.pct}% da meta)
    <span class="sp">|</span>
    ${tP?`<span class="hi">🔥 TOP PRODUTO:</span> ${tP.n} — ${tP.q}un — ${R(tP.f)} <span class="sp">|</span>`:''}
    ${tF?`<span class="hi">🥇 TOP FORNECEDOR:</span> ${tF.n} — ${R(tF.f)} <span class="sp">|</span>`:''}
    <span class="hi">💰 ${lbl}:</span> ${R(d.tPer)} (${d.pctPer}%) · Ticket ${R(d.nPer>0?d.tPer/d.nPer:0)}
    <span class="sp">|</span>
    <span class="hi">📅 MÊS:</span> ${R(d.tMes)} / Meta ${R(d.metaMes)} (${d.pctMes}%)
    <span class="sp">|</span>`;
}

// ── FILTROS ─────────────────────────────────────────────────────
function filtrar(modo) {
  _modo = modo;
  ['dia','mes','custom'].forEach(m=>{
    document.getElementById('f'+m.charAt(0).toUpperCase()+m.slice(1)).classList.toggle('on',m===modo);
  });
  document.getElementById('fCustom').classList.toggle('show',modo==='custom');
  if(modo!=='custom'&&_cache) renderComCache();
}

function aplicar() {
  const ini=document.getElementById('fIni').value;
  const fim=document.getElementById('fFim').value;
  if(!ini||!fim){alert('Selecione início e fim!');return;}
  // Converte YYYY-MM-DD → M/D/YYYY
  const conv=s=>{const p=s.split('-');return `${+p[1]}/${+p[2]}/${p[0]}`;};
  _ini=conv(ini); _fim=conv(fim);
  if(_cache) renderComCache();
}

function renderComCache() {
  if(!_cache) return;
  document.getElementById('sLbl').textContent='CALCULANDO';
  setTimeout(()=>{
    const d=processar(_cache.pRows,_cache.iRows,_cache.metas);
    render(d);
    document.getElementById('sLbl').textContent='AO VIVO';
  },10);
}

// ── LOAD ────────────────────────────────────────────────────────
async function load() {
  document.getElementById('sLbl').textContent='CARREGANDO';
  document.getElementById('ov').style.display='flex';
  document.getElementById('dash').style.display='none';
  try {
    setLoad(5,'Conectando...');
    const metas = await getMetas();
    setLoad(30,'Buscando pedidos...');
    const pRows = await fetchSheet(KOND_ID,'A:BQ','tinyerp_pedidos_detalhes');
    console.log('[Pedidos]',pRows.length,'linhas');
    setLoad(70,'Buscando itens...');
    let iRows=[];
    try { iRows=await fetchSheet(KOND_ID,'A:N','tinyerp_pedidos_detalhes_itens'); console.log('[Itens]',iRows.length,'linhas'); }
    catch(e){ console.warn('[Itens]',e.message); }
    setLoad(90,'Processando...');
    _cache={pRows,iRows,metas};
    const d=processar(pRows,iRows,metas);
    document.getElementById('ov').style.display='none';
    document.getElementById('dash').style.display='flex';
    render(d);
    document.getElementById('sLbl').textContent='AO VIVO';
    setLoad(100);
    console.log(`[OK] Período: R$${d.tPer.toFixed(2)} | Mês: R$${d.tMes.toFixed(2)}`);
  } catch(e) {
    console.error('[Erro]',e);
    document.getElementById('lt').textContent='❌ '+e.message;
    document.getElementById('sLbl').textContent='ERRO';
  }
}

// Clock
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR'),1000);

// Init
load();
setInterval(load, 5*60*1000);
</script>
